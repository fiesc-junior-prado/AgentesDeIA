[project]
name = "solar-agent"
version = "0.1.0"
description = "Agente de IA com LangChain, LangGraph e FastAPI para consulta e inclusão de créditos de energia solar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.45",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false