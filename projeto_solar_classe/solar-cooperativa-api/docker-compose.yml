services:
  db:
    image: postgres:16-alpine
    container_name: solar_postgres
    environment:
      POSTGRES_USER: solar_user
      POSTGRES_PASSWORD: solar_pass
      POSTGRES_DB: solar_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar_user -d solar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: solar_fastapi
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://solar_user:solar_pass@db:5432/solar_db
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

volumes:
  postgres_data: